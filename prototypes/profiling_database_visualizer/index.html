<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profiling Database Explorer — Prototype</title>
    <style>
      :root { color-scheme: dark; --ink:#e8edf7; --muted:#91a0b8; --line:#27344b; --panel:#101b2d; --canvas:#08111f; --blue:#61a7ff; --teal:#4bd8bd; --yellow:#ffca5f; --red:#ff7594; }
      * { box-sizing: border-box; } body { margin:0; font:14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; background:var(--canvas); color:var(--ink); }
      button, input { font:inherit; } button { cursor:pointer; } .shell { max-width:1280px; padding:34px 28px 115px; margin:auto; }
      header { display:flex; align-items:start; justify-content:space-between; gap:24px; border-bottom:1px solid var(--line); padding-bottom:24px; } h1 { margin:0; font-size:28px; letter-spacing:-.04em; } h2 { font-size:17px; margin:0 0 14px; } h3 { margin:0; font-size:13px; color:var(--muted); font-weight:600; }
      .eyebrow { color:var(--teal); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; margin-bottom:7px; } .sub { color:var(--muted); margin:7px 0 0; max-width:700px; }
      .actions { display:flex; align-items:center; flex-wrap:wrap; justify-content:end; gap:9px; } .button { border:1px solid var(--line); color:var(--ink); background:#16233a; padding:9px 12px; border-radius:7px; } .button:hover { border-color:var(--blue); } .file { display:none; }
      .badge { padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700; background:#1e293b; color:var(--muted); } .badge.synthetic { background:#493b19; color:var(--yellow); } .badge.good { color:var(--teal); background:#123a39; } .badge.bad { color:var(--red); background:#442132; }
      .meta { display:flex; gap:8px; align-items:center; margin-top:18px; color:var(--muted); font-size:12px; } .dot { color:#4b5c79; }
      .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0; }.card { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:16px; }.value { font-size:26px; font-weight:750; letter-spacing:-.04em; margin-top:4px; }.note { color:var(--muted); font-size:12px; margin-top:3px; }
      .section { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:19px; margin-top:14px; } .section-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:14px; }
      table { width:100%; border-collapse:collapse; } th { color:var(--muted); font-weight:600; text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.07em; padding:0 10px 9px; } td { padding:11px 10px; border-top:1px solid var(--line); vertical-align:middle; } .right { text-align:right; }.mono { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; }.empty { color:var(--muted); padding:25px; text-align:center; }
      .split { display:grid; grid-template-columns:1.25fr .75fr; gap:14px; }.tool-tabs { display:flex; gap:7px; flex-wrap:wrap; }.tab { padding:7px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--muted); }.tab.active { color:#06111f; background:var(--blue); border-color:var(--blue); font-weight:700; }.config { border-top:1px solid var(--line); padding:14px 0; }.config:first-child { border-top:0; padding-top:0; }.config-title { display:flex; justify-content:space-between; align-items:center; }.bars { display:grid; gap:9px; margin-top:13px; }.bar-row { display:grid; grid-template-columns:90px 1fr 55px; gap:9px; align-items:center; font-size:12px; }.track { background:#22304a; height:7px; border-radius:9px; overflow:hidden; }.fill { height:100%; background:var(--blue); border-radius:inherit; }.fill.resource { background:var(--yellow); }.fill.quality { background:var(--teal); }
      .legend { display:flex; gap:14px; color:var(--muted); font-size:12px; }.legend span::before { content:""; display:inline-block; height:8px; width:8px; border-radius:50%; background:var(--blue); margin-right:5px; }.legend .quality::before { background:var(--teal); }.legend .resource::before { background:var(--yellow); }
      .network { display:grid; grid-template-columns:1fr 1fr; gap:13px; }.transfer { border:1px solid var(--line); padding:14px; border-radius:7px; background:#0d1728; }.route { display:flex; gap:8px; align-items:center; font-weight:700; }.arrow { color:var(--blue); }.transfer-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:13px; color:var(--muted); font-size:12px; }.transfer-grid strong { display:block; color:var(--ink); font-size:15px; margin-top:1px; }.callout { border-left:3px solid var(--yellow); background:#231d11; padding:11px 13px; color:#e5d8b5; font-size:12px; margin-top:14px; }
      .switcher { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:10px; padding:8px; background:#f0f5ff; color:#101827; border-radius:999px; box-shadow:0 12px 35px #0009; }.switcher button { background:#dbe6fa; border:0; width:32px; height:32px; border-radius:50%; font-weight:800; }.switcher button:hover { background:#bdcff1; }.switcher span { min-width:183px; text-align:center; font-size:12px; font-weight:750; }
      @media (max-width:760px) { .shell { padding:20px 14px 100px; } header { display:block; }.actions { margin-top:16px; justify-content:start; }.grid { grid-template-columns:1fr 1fr; }.split,.network { grid-template-columns:1fr; } th:nth-child(4),td:nth-child(4) { display:none; }.bar-row { grid-template-columns:58px 1fr 48px; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div><div class="eyebrow">PROTOTYPE · profiling snapshot explorer</div><h1>Profiling database</h1><p class="sub">Read-only visual inspection of a schema v1.1 snapshot. Load the synthetic fixture or choose a locally exported snapshot.</p></div>
        <div class="actions"><span id="kind" class="badge">Loading</span><button class="button" id="fake">Load fake snapshot</button><label class="button" for="file">Load JSON file</label><input class="file" id="file" type="file" accept="application/json,.json" /></div>
      </header>
      <div class="meta"><span id="snapshot">No snapshot loaded</span><span class="dot">•</span><span id="digest" class="mono"></span></div>
      <div id="app"></div>
    </main>
    <nav class="switcher" id="switcher" aria-label="Prototype view switcher"><button id="prev" aria-label="Previous view">←</button><span id="view-label"></span><button id="next" aria-label="Next view">→</button></nav>
    <script>
      // Three variants of the profiling database page, switchable via ?variant=.
      const variants = [
        {key:'overview', label:'A — Coverage overview'},
        {key:'tool', label:'B — Tool inspector'},
        {key:'network', label:'C — Network routes'},
      ];
      let snapshot, schema, selectedTool = 0;
      const fmt = (n, digits=1) => Number(n).toLocaleString(undefined,{maximumFractionDigits:digits});
      const eligible = () => snapshot.tools.filter(t => t.eligibility.status === 'eligible');
      const profiles = () => eligible().flatMap(t => t.execution_profiles.map(p => ({...p, tool_id:t.tool_id})));
      function html(strings,...values) { return strings.reduce((r,s,i)=>r+s+(values[i]??''),''); }
      function currentVariant() { const k = new URLSearchParams(location.search).get('variant'); return variants.some(v=>v.key===k) ? k : 'overview'; }
      function setVariant(key) { const u=new URL(location);u.searchParams.set('variant',key);history.replaceState({},'',u);render(); }
      function summaryCards() {
        const ps=profiles(); const compatible=ps.length; const configurations=eligible().reduce((n,t)=>n+t.configurations.length,0);
        return html`<div class="grid"><div class="card"><h3>Known tools</h3><div class="value">${snapshot.tools.length}</div><div class="note">${eligible().length} eligible for scheduling</div></div><div class="card"><h3>Configurations</h3><div class="value">${configurations}</div><div class="note">runtime choices, not placements</div></div><div class="card"><h3>Execution profiles</h3><div class="value">${compatible}</div><div class="note">compatible configuration × device pairs</div></div><div class="card"><h3>Transfer routes</h3><div class="value">${snapshot.transfer_profiles.length} / 6</div><div class="note">directed cross-device measurements</div></div></div>`;
      }
      function overview() {
        const rows=eligible().flatMap(tool=>tool.configurations.map(c=>{const q=tool.quality_profiles.find(p=>p.configuration_id===c.configuration_id);const ep=tool.execution_profiles.filter(p=>p.configuration_id===c.configuration_id);return `<tr><td><strong>${tool.tool_id}</strong></td><td class="mono">${c.configuration_id}</td><td>${q ? (q.normalized_quality_lcb*100).toFixed(0)+'%' : '—'}</td><td>${ep.map(p=>p.device_id).join(', ')||'—'}</td><td class="right">${ep.length}</td></tr>`;}));
        return summaryCards()+`<section class="section"><div class="section-head"><h2>Configuration coverage</h2><span class="badge good">schema v${snapshot.schema_version}</span></div><table><thead><tr><th>Tool</th><th>Configuration</th><th>Quality LCB</th><th>Compatible placement</th><th class="right">Profiles</th></tr></thead><tbody>${rows.join('')}</tbody></table></section><section class="section"><div class="section-head"><h2>Snapshot boundary</h2><span class="badge">immutable replay input</span></div><div class="split"><div><h3>Execution boundary</h3><p>${snapshot.measurement_scope.execution_boundary}</p></div><div><h3>Input bucket</h3><p class="mono">${snapshot.measurement_scope.input_bucket} · batch ${snapshot.measurement_scope.batch_size} · ${snapshot.measurement_scope.warm_execution?'warm':'cold'}</p></div></div></section>`;
      }
      function toolInspector() {
        const tools=eligible(); const t=tools[selectedTool]||tools[0]; if(!t)return '<div class="empty">No eligible tools in this snapshot.</div>';
        const configs=t.configurations.map(c=>{const q=t.quality_profiles.find(p=>p.configuration_id===c.configuration_id); const ex=t.execution_profiles.filter(p=>p.configuration_id===c.configuration_id); const maxL=Math.max(...t.execution_profiles.map(p=>p.warm_latency_p95_ms)); const maxResource=Math.max(...t.execution_profiles.map(p=>p.gpu_memory_mib)); return `<article class="config"><div class="config-title"><strong class="mono">${c.configuration_id}</strong><span class="badge">${c.runtime.backend} · ${c.runtime.numeric_format}</span></div><div class="bars"><div class="bar-row"><span>Quality</span><div class="track"><div class="fill quality" style="width:${(q?.normalized_quality_lcb||0)*100}%"></div></div><strong>${q?(q.normalized_quality_lcb*100).toFixed(0)+'%':'—'}</strong></div>${ex.map(p=>`<div class="bar-row"><span>${p.device_id}</span><div class="track"><div class="fill" style="width:${p.warm_latency_p95_ms/maxL*100}%"></div></div><strong>${fmt(p.warm_latency_p95_ms)} ms</strong></div><div class="bar-row"><span>${p.device_id} resource</span><div class="track"><div class="fill resource" style="width:${p.gpu_memory_mib/maxResource*100}%"></div></div><strong>${fmt(p.gpu_memory_mib)} MiB</strong></div>`).join('')}</div></article>`;}).join('');
        return `<section class="section"><div class="section-head"><div><h2>Tool inspector</h2><div class="tool-tabs">${tools.map((x,i)=>`<button class="tab ${i===selectedTool?'active':''}" data-tool="${i}">${x.tool_id}</button>`).join('')}</div><div class="legend"><span class="quality">Quality LCB</span><span>Latency</span><span class="resource">GPU-memory resource ↓</span></div></div><div class="split"><div><h3>Configurations and placement trade-offs</h3><div style="margin-top:15px">${configs}</div></div><aside><h3>Quality contract</h3><p><strong>${t.quality_contract.metric_name}</strong> · ${t.quality_contract.direction.replaceAll('_',' ')}</p><p class="note">Semantic floor: ${t.quality_contract.semantic_floor}<br>Reference: <span class="mono">${t.quality_contract.reference.configuration_id}</span> (${t.quality_contract.reference.raw_metric})</p><h3 style="margin-top:22px">Dimensions</h3>${Object.entries(t.dimensions).map(([k,v])=>`<p class="note"><span class="mono">${k}</span><br>${v.applicable?'choices:':'fixed:'} ${v.values.join(', ')}</p>`).join('')}</aside></div></section>`;
      }
      function network() { const cards=snapshot.transfer_profiles.map(p=>`<article class="transfer"><div class="route"><span>${p.source_device_id}</span><span class="arrow">→</span><span>${p.destination_device_id}</span></div><div class="transfer-grid"><div>Propagation<strong>${fmt(p.propagation_delay_ms)} ms</strong></div><div>Bandwidth<strong>${fmt(p.bandwidth_bytes_per_second/1e6)} MB/s</strong></div><div>Resource<strong>GPU memory only</strong></div><div>Samples<strong>${fmt(p.sample_count,0)}</strong></div></div></article>`).join(''); return summaryCards()+`<section class="section"><div class="section-head"><h2>Directed transfer profiles</h2><span class="badge good">${snapshot.transfer_profiles.length===6?'complete directed graph':'incomplete graph'}</span></div><div class="network">${cards}</div><div class="callout">Transfers contribute latency only. Trace resource is measured from execution profiles' GPU-memory values; same-device edges have zero transfer cost and no transfer profile.</div></section><section class="section"><h2>Devices</h2><table><thead><tr><th>ID</th><th>Hardware class</th><th>Description</th></tr></thead><tbody>${snapshot.devices.map(d=>`<tr><td class="mono">${d.device_id}</td><td>${d.hardware_class}</td><td>${d.description}</td></tr>`).join('')}</tbody></table></section>`; }
      function render() { const key=currentVariant(); document.getElementById('view-label').textContent=variants.find(v=>v.key===key).label; const app=document.getElementById('app'); if(!snapshot){app.innerHTML='<div class="empty">Loading snapshot…</div>';return;} app.innerHTML=key==='overview'?overview():key==='tool'?toolInspector():network(); app.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{selectedTool=+b.dataset.tool;render();}); }
      function load(data) { const missing=(schema?.required||['tools','transfer_profiles']).filter(key=>data?.[key]===undefined); if(missing.length) throw new Error(`Not a ${schema?.title||'profiling database'} snapshot; missing: ${missing.join(', ')}.`); if(!Array.isArray(data.tools)||!Array.isArray(data.transfer_profiles)) throw new Error('tools and transfer_profiles must be arrays.'); snapshot=data; document.getElementById('snapshot').textContent=`${data.snapshot_id} · ${data.created_at}`; const kind=document.getElementById('kind');kind.textContent=data.data_kind||'unknown';kind.className='badge '+(data.data_kind==='synthetic'?'synthetic':'good');document.getElementById('digest').textContent=data.snapshot_digest||'no digest'; selectedTool=0;render(); }
      async function loadFake(){try{load(await (await fetch('/fake-data')).json())}catch(e){document.getElementById('app').innerHTML=`<div class="empty">Could not load fake snapshot: ${e.message}</div>`}}
      document.getElementById('fake').onclick=loadFake; document.getElementById('file').onchange=async e=>{try{load(JSON.parse(await e.target.files[0].text()))}catch(err){alert(err.message)}};
      document.getElementById('prev').onclick=()=>{const i=variants.findIndex(v=>v.key===currentVariant());setVariant(variants[(i+variants.length-1)%variants.length].key)};document.getElementById('next').onclick=()=>{const i=variants.findIndex(v=>v.key===currentVariant());setVariant(variants[(i+1)%variants.length].key)};
      addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click()});
      fetch('/schema').then(r=>r.json()).then(value=>schema=value).catch(()=>undefined).finally(loadFake);
    </script>
  </body>
</html>
