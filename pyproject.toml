[project]
name = "eec-sched"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "pillow>=10",
    "pyyaml>=6.0",
    "torch>=2.2",
    "transformers>=4.40,<5",
]

[tool.uv]
package = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]
profiling = [
    "evaluate>=0.4",
    "jiwer>=3",
    "librosa>=0.10",
    "rouge-score>=0.1.2",
    "soundfile>=0.12",
    "torchcodec>=0.9",
    "pycocotools>=2.0.10",
    "pycocoevalcap>=1.2",
]
