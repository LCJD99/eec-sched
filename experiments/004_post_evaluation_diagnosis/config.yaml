  - /workflow: mnms
  - /evidence: fake_snapshot
  - /evaluation: canonical
  - /diagnosis: one_shot
  - /loop: post_evaluation_diagnosis
  - /search: psocm
  - /memory: in_run
  - /candidate_runtime: in_process
